<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diagonal Pixel Art Generator</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>
    <h1>Diagonal Pixel Art Generator</h1>
    
    <div style="display: flex; gap: 20px; align-items: center; margin-bottom: 20px;">
        <input type="file" id="file-upload" accept="image/*">
        
        <div id="paste-box" 
             contenteditable="true" 
             class="paste-area">
            <span>Click here, then press <b>Ctrl+V</b> to paste</span>
        </div>
        
        <style>
            .paste-area {
                width: 300px;
                height: 100px;
                border: 3px dashed #666;
                border-radius: 10px;
                background-color: #f8f9fa;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                color: #555;
                cursor: pointer;
                overflow: hidden; /* Prevents giant images from exploding the layout */
                transition: background-color 0.2s;
            }
            
            .paste-area:focus {
                outline: none;
                border-color: #007bff;
                background-color: #e9ecef;
            }
        </style>
    </div>
    
    <div id="plot-output"></div>

    <script type="py" src="./steps_viewable_diagonal_pixelart_gen.py" config="./pyscript.json"></script>
</body>
</html>
