<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagonal Pixel Art Generator</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    
    <link rel="stylesheet" href="styles.css">
    
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>

    <h1>Diagonal Pixel Art Generator</h1>
    
    <div class="controls-wrapper">
        
        <div class="control-column">
            <label>Option 1: Upload File</label>
            <input type="file" id="file-upload" accept="image/*">
        </div>
    
        <div class="control-column">
            <label>Option 2: Paste Image</label>
            <div id="paste-box" class="paste-area" tabindex="0">
                <span id="placeholder-text" class="placeholder-text">
                    Click here &<br>Press <b>Ctrl+V</b>
                </span>
            </div>
            <div id="debug-log"></div>
        </div>

        <div class="control-column">
            <label>Option 3: Settings</label>
            
            <div style="margin-bottom: 15px;">
                <label for="block-count" style="font-size: 0.9em; margin-bottom: 4px;">Total Blocks:</label>
                <input type="number" id="block-count" value="275" min="10" max="2000">
            </div>

            <div>
                <label for="grid-size" style="font-size: 0.9em; margin-bottom: 4px;">Grid Size (e.g. 44):</label>
                <input type="number" id="grid-size" value="44" min="20" max="200">
            </div>
        </div>

    </div>
    
    <hr style="width: 100%; border: 0; border-top: 1px solid #ddd; margin: 30px 0;">
    
    <div id="plot-output"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pasteBox = document.getElementById('paste-box');
            
            pasteBox.addEventListener('paste', async (e) => {
                e.preventDefault(); 
                
                const log = document.getElementById('debug-log');
                log.innerText = "Paste detected...";
                
                let blob = null;
                const items = e.clipboardData.items;
    
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) {
                        blob = items[i].getAsFile();
                        break;
                    }
                }
    
                if (blob) {
                    pasteBox.innerHTML = ''; 
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(blob);
                    img.className = 'preview-img'; 
                    pasteBox.appendChild(img);
                    
                    const buffer = await blob.arrayBuffer();
                    const uint8Arr = new Uint8Array(buffer);
                    
                    // Logic to wait for Python to load
                    if (window.process_image_from_js) {
                        log.innerText = "Processing...";
                        window.process_image_from_js(uint8Arr);
                    } else {
                        log.innerText = "Python is loading... please wait...";
                        
                        let attempts = 0;
                        const checkPython = setInterval(() => {
                            attempts++;
                            if (window.process_image_from_js) {
                                log.innerText = "Python loaded! Processing now...";
                                window.process_image_from_js(uint8Arr);
                                clearInterval(checkPython);
                            } else if (attempts > 20) { 
                                log.innerText = "Error: Python timed out. Please refresh.";
                                clearInterval(checkPython);
                            }
                        }, 500); 
                    }
                } else {
                    log.innerText = "No image data found in clipboard.";
                }
            });
        });
    </script>

    <script type="py" src="./steps_viewable_diagonal_pixelart_gen.py" config="./pyscript.json"></script>
</body>
</html>
