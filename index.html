<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diagonal Pixel Art Generator</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>
    <h1>Diagonal Pixel Art Generator</h1>
    
    <div style="display: flex; gap: 20px; align-items: center; margin-bottom: 20px;">
        <input type="file" id="file-upload" accept="image/*">
        
        <div id="paste-box" 
             contenteditable="true" 
             style="width: 200px; height: 40px; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center; color: #888; cursor: pointer;">
            Click here & Paste (Ctrl+V)
        </div>
    </div>
    
    <div id="plot-output"></div>

    <script type="py" src="./steps_viewable_diagonal_pixelart_gen.py" config="./pyscript.json"></script>
</body>
</html>
