<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diagonal Pixel Art Generator</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <style>
        .paste-area {
            width: 150px;
            height: 150px;
            border: 3px dashed #666;
            border-radius: 10px;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #555;
            cursor: pointer;
            outline: none;
            overflow: hidden; /* Just in case */
        }
        .paste-area:focus {
            border-color: #007bff;
            background-color: #e9ecef;
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const box = document.getElementById("paste-box");
            box.addEventListener("paste", (event) => {
                event.preventDefault(); // This stops the "Giant Image"
            });
        });
    </script>
</head>
<body>
    <h1>Diagonal Pixel Art Generator</h1>
    
    <div style="display: flex; gap: 20px; align-items: center; margin-bottom: 20px;">
        <input type="file" id="file-upload" accept="image/*">
        
        <div id="paste-box" contenteditable="true" class="paste-area">
            <p>Click here, then press <b>Ctrl+V</b></p>
        </div>
    </div>
    
    <div id="plot-output"></div>

    <script type="py" src="./steps_viewable_diagonal_pixelart_gen.py" config="./pyscript.json"></script>
</body>
</html>
