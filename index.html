<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diagonal Pixel Art Generator</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .paste-area {
            width: 150px; height: 150px; 
            border: 3px dashed #666; border-radius: 10px;
            background-color: #f8f9fa;
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; cursor: pointer; outline: none;
        }
        .paste-area {
        width: 150px; height: 150px; 
        border: 3px dashed #666; 
        display: flex; align-items: center; justify-content: center; 
        overflow: hidden;
    }

    .preview-img {
        width: 100%;
        height: 100%;
        object-fit: contain; /* <--- This forces the whole image to show */
        display: block;
    }
    </style>

    <script>
        window.convertBlobToBytes = async function(blob) {
            const buffer = await blob.arrayBuffer();
            return new Uint8Array(buffer);
        }
    </script>
</head>
<body>
    <h1>Diagonal Pixel Art Generator</h1>
    
    <div style="display: flex; gap: 20px; align-items: start;">
        <div>
            <label><b>Option 1:</b> Upload File</label><br>
            <input type="file" id="file-upload" accept="image/*" style="margin-top: 5px;">
        </div>
        
        <div>
            <label><b>Option 2:</b> Paste Image</label><br>
            <div id="paste-box" contenteditable="true" class="paste-area">
                <span style="color: #888; text-align: center; font-size: 14px;">
                    Click here &<br>Press <b>Ctrl+V</b>
                </span>
            </div>
            <div id="debug-log" style="margin-top:5px; color: crimson; font-family: monospace; font-size: 0.9em;"></div>
        </div>
    </div>
    
    <hr>
    <div id="plot-output"></div>

    <script type="py" src="./steps_viewable_diagonal_pixelart_gen.py" config="./pyscript.json"></script>
</body>
</html>
