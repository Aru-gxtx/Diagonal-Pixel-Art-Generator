<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diagonal Pixel Art Generator</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <style>
        .paste-area {
            width: 150px;       /* Fixed Width */
            height: 150px;      /* Fixed Height */
            border: 3px dashed #666;
            border-radius: 10px;
            background-color: #f8f9fa;
            
            display: flex;
            align-items: center;
            justify-content: center;
            
            overflow: hidden;   /* Cut off anything that overflows (safety net) */
            cursor: pointer;
            outline: none;
        }
    
        #paste-box img {
            max-width: 100%;     /* Never wider than the box */
            max-height: 100%;    /* Never taller than the box */
            object-fit: contain; /* "Squish" it to show the FULL image without cropping */
            display: block;      /* Removes extra text spacing */
        }
    </style>
</head>
<body>
    <h1>Diagonal Pixel Art Generator</h1>
    
    <div style="display: flex; gap: 20px; align-items: start;">
        <div>
            <label><b>Option 1:</b> Upload File</label><br>
            <input type="file" id="file-upload" accept="image/*" style="margin-top: 8px;">
        </div>
        
        <div>
            <label><b>Option 2:</b> Paste Image</label><br>
            <div id="paste-box" contenteditable="true" class="paste-area">
                <span>Click here &<br>Press <b>Ctrl+V</b></span>
            </div>
            <div id="debug-log"></div>
        </div>
    </div>
    
    <hr style="margin: 20px 0;">
    
    <div id="plot-output"></div>

    <script type="py" src="./steps_viewable_diagonal_pixelart_gen.py" config="./pyscript.json"></script>
</body>
</html>
